<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Chat Box</title>
</head>
<body>
    <button id="toggleChat">Abrir Chat</button>
    <div id="chatBox">
        <div id="chatHeader">
            <h2>Chat Box</h2>
            <button id="closeChat">Cerrar</button>
        </div>
        <div id="chatContent">
            <div class="message received">
                <p>Hola, soy Nicolas. ¿Cómo estás? ¿En qué te puedo ayudar?</p>
            </div>
            <div class="message options">
                <p>Opciones:</p>
                <ul>
                    <li><a href="#" id="opcion1">Opción 1: Sobre la Web</a></li>
                    <li><a href="#" id="opcion2">Opción 2: No encuentro cierta información</a></li>
                    <li><a href="#" id="opcion3">Opción 3: Contactos</a></li>
                </ul>
            </div>
        </div>
    </div>
    <script src="scrip.js"></script>
</body>
</html>
